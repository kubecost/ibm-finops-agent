name: Trigger Build in integration-ci-cd

on:
  push:
    tags:
      - 'v*'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger repository dispatch
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          echo '{"event_type":"finops-agent-release","client_payload":{"tag":"${{ github.ref_name }}"}}' \
            | gh api repos/kubecost/integration-ci-cd/dispatches --input -
