name: Build test agent

on:
  pull_request:
    branches:
      - develop
env:
  IMAGE_TAG_BASE: "gcr.io/${{ vars.GCR_PROJECT_ID }}/agent"

jobs:
  build_test_agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    outputs:
      AGENT_IMAGE_TAG: ${{ steps.tag.outputs.AGENT_IMAGE_TAG }}

    steps:
      - name: Checkout ibm-finops-agent
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head.sha || github.ref }}
          path: ./ibm-finops-agent

      # Creates tags for agent images 
      - name: Set image tag
        id: tag
        run: |
          echo "AGENT_IMAGE_TAG=${{ env.IMAGE_TAG_BASE }}:${{ github.event.pull_request.head.sha || github.event.merge_group.head.sha || github.ref }}" >> $GITHUB_OUTPUT

      - name: Output config info
        run: |
          echo "Agent image tag: ${{ steps.tag.outputs.AGENT_IMAGE_TAG }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build test agent
        id: docker_build_agent
        uses: docker/build-push-action@v6
        with:
          context: ./ibm-finops-agent
          file: ./ibm-finops-agent/Dockerfile
          platforms: "linux/amd64,linux/arm64"
          push: false
          build-args: |
            version=${{ github.event.pull_request.head.sha || github.event.merge_group.head.sha || github.ref }}
          tags: |
            ${{ steps.tag.outputs.AGENT_IMAGE_TAG }}
  # Builds and pushes the PR image to ICR via integration-ci-cd. The image is
  # tagged pr-<pr number>-<short sha> and integration-ci-cd comments on the PR.
  # Skipped for fork and Dependabot PRs, which cannot read the app secrets.
  trigger_pr_image:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # The job authenticates with the app token, not GITHUB_TOKEN.
    permissions: {}
    concurrency:
      group: trigger-pr-image-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Generate app token with permissions to dispatch to integration-ci-cd
        id: generate-app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.KC_ACTIONS_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.KC_ACTIONS_BOT_APP_PRIVATE_KEY }}
          repositories: integration-ci-cd
          permission-contents: write
      - name: Trigger finops-agent-pr dispatch
        env:
          GH_TOKEN: ${{ steps.generate-app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          jq -n --arg pr "$PR_NUMBER" --arg sha "$HEAD_SHA" \
            '{event_type: "finops-agent-pr", client_payload: {pr_number: $pr, sha: $sha}}' \
            | gh api repos/kubecost/integration-ci-cd/dispatches --input -
