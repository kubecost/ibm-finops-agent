name: Unit Tests and Build Docker Image

on:
  schedule:
    - cron: "0 14 * * *"
  pull_request:
    branches:
      - develop
      - v*.*
  push:
    branches:
      - develop

  merge_group:
    types: [checks_requested]

jobs:
  # Fails the build only when our own code actually calls a vulnerable symbol.
  # govulncheck performs reachability analysis, so advisories in modules we
  # require but never call are reported without failing the job. That matters
  # here: we currently carry three such advisories that have no fix available
  # (golang.org/x/crypto openpgp, and two aws-sdk-go v1 s3crypto issues), and a
  # scanner that failed on those would need a permanently-maintained ignore
  # list. This job needs none.
  #
  # Runs independently of build-and-test so a failing unit test does not mask a
  # vulnerability, and vice versa. It also inherits this workflow's nightly
  # cron, which is where most of the value is: newly published advisories are
  # caught against unchanged code, without waiting for someone to open a PR.
  vuln-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # Pinned rather than @latest so the scanner itself is reproducible and
      # cannot change under us mid-review. This does not stale the advisory
      # data: govulncheck fetches the vulnerability database from vuln.go.dev
      # at run time, so a pinned binary still sees newly published advisories.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        run: govulncheck ./...

  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag:
        ${{ steps.meta.outcome == 'success' &&
        fromJSON(steps.meta.outputs.json).tags[0] || '' }}

    steps:
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ./ibm-finops-agent

      # Saves us from having to redownload all modules
      - name: Go Mod cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # The directory is important. We cover both OC and KCM with the
          # ./kubecost/**/go.sum hash. Critically important because of the
          # "replace" in KCM's go.mod
          key:
            ${{ runner.os }}-go-${{ hashFiles('./ibm-finops-agent/**/go.sum') }}

      - name: Test
        working-directory: ./ibm-finops-agent
        run: |
          make test

      - name: Lint
        working-directory: ./ibm-finops-agent
        run: |
          make ci-lint

      - name: Check go fix
        working-directory: ./ibm-finops-agent
        run: |
          make go-fix-check

      - name: get-pr-info
        shell: bash
        env:
          PR_NUM: ${{ github.event.number }}
        run: |
          echo $PR_NUM > pr_num.txt
          echo $GITHUB_BASE_REF > base.txt
          echo $GITHUB_HEAD_REF > head.txt
          mv ./ibm-finops-agent/coverage.out coverage.out

      - name: save coverage file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-coverage
          retention-days: 5
          path: |
            coverage.out
            pr_num.txt
            base.txt
            head.txt

      - name: Build Go binary
        working-directory: ./ibm-finops-agent
        run: |
          go build -o ibm-finops-agent ./cmd/finops-agent/main.go

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/ibm-finops-agent
          tags: |
            type=sha,prefix=pr-
            type=ref,event=pr
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and Push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./ibm-finops-agent
          file: ./ibm-finops-agent/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DUCK_VERSION=v0.9.2
            version=${{ steps.meta.outputs.version }}
            commit=${{ github.sha }}

  e2e-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        k8s-version: ["v1.34.0", "v1.33.0", "v1.32.0", "v1.31.0"]

    steps:
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ./ibm-finops-agent

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: docker pull ${{ needs.build-and-test.outputs.image-tag }}

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 3.18.4

      - name: E2E testing for ${{ matrix.k8s-version }}
        working-directory: ./ibm-finops-agent
        run: |
          helm repo add ibm-finops https://kubecost.github.io/finops-agent-chart
          helm repo add localstack https://helm.localstack.cloud
          KUBERNETES_VERSION=${{ matrix.k8s-version }} IMAGE=${{ needs.build-and-test.outputs.image-tag }} TEMP_DIR=$(mktemp -d) e2e/e2e.sh

  # Go/Ginkgo replacement for e2e-test (see e2e/harness). Runs next to the shell
  # suite until it reaches parity. It is not added it to the
  # required status checks yet.
  e2e-go:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        k8s-version: ["v1.34.0", "v1.33.0", "v1.32.0", "v1.31.0"]
    env:
      IMAGE: ${{ needs.build-and-test.outputs.image-tag }}
      KUBERNETES_VERSION: ${{ matrix.k8s-version }}
      # Absolute, because go test runs from e2e/ and a relative path would
      # resolve there. Holds the kubeconfig, which must not be uploaded.
      # (The runner context is not available in job-level env, so no runner.temp.)
      ARTIFACTS_DIR: ${{ github.workspace }}/e2e-artifacts/${{ matrix.k8s-version }}
      # This prevents the cluster from being deleted. Once the work from
      # artifacts are uploaded, this can be removed. Until then it provides
      # the ability to look at the cluster on a failure to debug. 
      KEEP_CLUSTER: "true"

    steps:
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ./ibm-finops-agent

      - name: Go Mod cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key:
            ${{ runner.os }}-go-${{ hashFiles('./ibm-finops-agent/**/go.sum') }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          if [ -z "$IMAGE" ]; then
            echo "::error::build-and-test produced no image tag"
            exit 1
          fi
          docker pull "$IMAGE"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 3.18.4

      - name: E2E (new suite) for ${{ matrix.k8s-version }}
        working-directory: ./ibm-finops-agent
        shell: bash 
        run: |
          mkdir -p "$ARTIFACTS_DIR"
          make e2e E2E_FLAGS="-ginkgo.junit-report=$ARTIFACTS_DIR/junit.xml" 2>&1 \
            | tee "$ARTIFACTS_DIR/ginkgo.log"

      # To be replaced by a summary.md the suite writes from ReportAfterSuite.
      # Summary.md will be addressed along with artifacts.
      - name: Summarize results
        if: always()
        shell: bash
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          version = os.environ["KUBERNETES_VERSION"]
          path = os.path.join(os.environ["ARTIFACTS_DIR"], "junit.xml")
          print(f"### Go E2E on Kubernetes {version}")
          print(f"Image: `{os.environ['IMAGE']}`")
          print()
          try:
              suites = ET.parse(path).getroot()
          except (OSError, ET.ParseError):
              # Ginkgo writes the report even when BeforeSuite fails, so a
              # missing or unreadable one means go test never got that far.
              print("No JUnit report: the suite did not finish (compile error, crash or timeout). See the job log.")
          else:
              print("| Spec | Result |")
              print("| --- | --- |")
              for case in suites.iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      result = "failed"
                  elif case.find("skipped") is not None:
                      result = "skipped"
                  else:
                      result = "passed"
                  print(f"| {case.get('name')} | {result} |")
          EOF

      # Stopgap until the suite saves its own artifacts
      - name: Collect cluster diagnostics
        if: failure()
        shell: bash
        run: |
          out="$ARTIFACTS_DIR/diagnostics"
          mkdir -p "$out"
          export KUBECONFIG="$ARTIFACTS_DIR/kubeconfig"
          kubectl get pods -A -o wide > "$out/pods.txt" || true
          kubectl describe pods -A > "$out/pods-describe.txt" || true
          kubectl get events -A --sort-by=.lastTimestamp > "$out/events.txt" || true
          kubectl logs -n ibm-finops-agent -l app.kubernetes.io/name=finops-agent \
            --all-containers --tail=-1 > "$out/agent.log" || true
          kind export logs "$out/kind" --name "e2e-$KUBERNETES_VERSION" || true

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-go-${{ matrix.k8s-version }}
          retention-days: 7
          if-no-files-found: warn
          # The kubeconfig holds cluster credentials.
          path: |
            ${{ env.ARTIFACTS_DIR }}
            !**/kubeconfig

  set-labels:
    needs: [build-and-test, e2e-test]
    runs-on: ubuntu-latest
    # Run this job even if tests fail (to label the PR accordingly)
    # Skip only if workflow was manually cancelled or not a PR
    if: always() && !cancelled() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Label based on test results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" \
              --add-label "unit tests failed" \
              --remove-label "unit tests passed"
          else
            gh pr edit "$PR_NUMBER" --repo "$REPO" \
              --add-label "unit tests passed" \
              --remove-label "unit tests failed"
          fi
