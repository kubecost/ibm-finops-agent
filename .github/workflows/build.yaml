name: Build agent

on:
    pull_request:
        branches:
            - develop
env:
  IMAGE_TAG_BASE: "gcr.io/${{ vars.GCR_PROJECT_ID }}/agent"

jobs:
  build_and_publish-agent-x86:
    runs-on: Kubecost-Linux-Large-x86
    permissions:
      contents: read
      id-token: write

    outputs:
      AGENT_IMAGE_TAG: ${{ steps.tag.outputs.AGENT_IMAGE_TAG }}

    steps:
      - name: Checkout ibm-finops-agent
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head.sha || github.ref }}
          path: ./ibm-finops-agent

      - name: Checkout opencost
        uses: actions/checkout@v4
        with:
          repository: 'opencost/opencost'
          ref: 'develop'
          fetch-depth: 0
          path: ./opencost

      # Creates tags for agent images 
      - name: Set image tag
        id: tag
        run: |
          echo "AGENT_IMAGE_TAG=${{ env.IMAGE_TAG_BASE }}:${{ github.event.pull_request.head.sha || github.event.merge_group.head.sha || github.ref }}-amd64" >> $GITHUB_OUTPUT

      - name: Output config info
        run: |
          echo "Agent image tag: ${{ steps.tag.outputs.AGENT_IMAGE_TAG }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCR_PROJECT_ID }}

      - name: gcloud auth configure-docker
        run: |
          gcloud --quiet auth configure-docker
      
      - name: Build and Push agent
        id: docker_build_agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ibm-finops-agent/Dockerfile
          platforms: "linux/amd64"
          push: true
          build-args: |
            version=${{ github.event.pull_request.head.sha || github.event.merge_group.head.sha || github.ref }}
          tags: |
            ${{ steps.tag.outputs.AGENT_IMAGE_TAG }}
  
  build_and_publish-agent-arm64:
    runs-on: Kubecost-Linux-Large-arm64
    permissions:
      contents: read
      id-token: write

    outputs:
      AGENT_IMAGE_TAG: ${{ steps.tag.outputs.AGENT_IMAGE_TAG }}

    steps:
      - name: Checkout ibm-finops-agent
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head.sha || github.ref }}
          path: ./ibm-finops-agent

      - name: Checkout opencost
        uses: actions/checkout@v4
        with:
          repository: 'opencost/opencost'
          ref: 'develop'
          fetch-depth: 0
          path: ./opencost

      # Creates tags for agent images 
      - name: Set image tag
        id: tag
        run: |
          echo "AGENT_IMAGE_TAG=${{ env.IMAGE_TAG_BASE }}:${{ github.event.pull_request.head.sha || github.event.merge_group.head.sha || github.ref }}-arm64" >> $GITHUB_OUTPUT

      - name: Output config info
        run: |
          echo "Agent image tag: ${{ steps.tag.outputs.AGENT_IMAGE_TAG }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCR_PROJECT_ID }}

      - name: gcloud auth configure-docker
        run: |
          gcloud --quiet auth configure-docker
      
      - name: Build and Push agent
        id: docker_build_agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ibm-finops-agent/Dockerfile
          platforms: "linux/arm64"
          push: true
          build-args: |
            version=${{ github.event.pull_request.head.sha || github.event.merge_group.head.sha || github.ref }}
          tags: |
            ${{ steps.tag.outputs.AGENT_IMAGE_TAG }}
  
  combine-manifests:
    runs-on: Kubecost-Linux-Large-x86
    needs: [build_and_publish-agent-arm64, build_and_publish-agent-x86]
    steps:
      - id: 'auth'
        name: Authenticate to GCP
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: guestbook-227502

      - name: gcloud auth configure-docker
        run: |
          gcloud --quiet auth configure-docker
          gcloud --quiet auth configure-docker us-central1-docker.pkg.dev
          
      - name: docker manifest push 
        run: |
          # Sanitize branch name: use head_ref for PRs, ref_name for direct pushes
          BRANCH_NAME="${{github.head_ref}}"
          if [ -z "$BRANCH_NAME" ]; then
            BRANCH_NAME="${{github.ref_name}}"
          fi
          SANITIZED_BRANCH_NAME=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9]/-/g')
          
          docker manifest create ${{needs.build_and_publish-agent-arm64.outputs.AGENT_IMAGE_TAG}} \
          ${{needs.build_and_publish-agent-arm64.outputs.AGENT_IMAGE_TAG}}-arm64 \
          ${{needs.build_and_publish-agent-x86.outputs.AGENT_IMAGE_TAG}}-amd64

          docker manifest push ${{needs.build_and_publish-agent-arm64.outputs.AGENT_IMAGE_TAG}}

          docker manifest inspect ${{needs.build_and_publish-agent-arm64.outputs.AGENT_IMAGE_TAG}}

          IMAGE_NAME=$(echo ${{needs.build_and_publish-agent-arm64.outputs.AGENT_IMAGE_TAG}} | rev | cut -d':' -f2- | rev)

          # push mutable tag of branch name using sanitized branch name
          docker manifest create ${IMAGE_NAME}:${SANITIZED_BRANCH_NAME} \
          ${{needs.build_and_publish-agent-arm64.outputs.AGENT_IMAGE_TAG}}-arm64 \
          ${{needs.build_and_publish-agent-x86.outputs.AGENT_IMAGE_TAG}}-amd64
          docker manifest push ${IMAGE_NAME}:${SANITIZED_BRANCH_NAME}