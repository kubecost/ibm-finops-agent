name: Automated FinOps Agent Release

# A version with an -rc.N suffix is a release candidate: it is tagged and its
# image built, then the run stops. It never touches finops-agent-chart, so no
# chart is published and no kubecost PR is opened.
run-name: ${{ inputs.dry_run && 'DRY RUN ' || '' }}${{ contains(inputs.version, '-rc.') && 'RC' || 'Release' }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (1.0.22 for a release, 1.0.22-rc.1 for a release candidate)"
        required: true
        type: string
      # Pinning the sha is what lets the final release be cut from the exact
      # code an RC soaked. Empty means the current develop HEAD.
      sha:
        description: "Full commit SHA to tag (optional, defaults to develop HEAD)"
        required: false
        default: ""
        type: string
      # Every irreversible action here is a `git push`, so a dry run passes
      # --dry-run to each one: git still contacts the remote and validates auth
      # and the ref update, but nothing lands. Steps that need a push to have
      # actually landed are skipped with `if: !inputs.dry_run`. Not exercised:
      # the image build, the chart PR merge and tag, and the chart publish.
      # RC dry runs stop after the tag push, like real RCs.
      dry_run:
        description: "Dry run (validate and edit locally, push nothing)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: finops-agent-release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  TAG: v${{ inputs.version }}
  BRANCH: finops-agent-v${{ inputs.version }}
  INPUT_SHA: ${{ inputs.sha }}

  # The only difference between a real release and a dry run.
  PUSH_ARGS: ${{ inputs.dry_run && '--dry-run' || '' }}

  # The cross-repo contract. The two workflow filenames name files in repos
  # this one cannot see, so a rename there surfaces here only as a "did not
  # start" timeout — keep them visible in one place.
  BUILD_REPO: kubecost/integration-ci-cd
  BUILD_WORKFLOW: finops-agent-build-release.yaml
  CHART_REPO: kubecost/finops-agent-chart
  CHART_WORKFLOW: publish-chart.yaml

  # Applies to every commit and annotated tag this workflow creates.
  GIT_AUTHOR_NAME: kc-actions-bot[bot]
  GIT_AUTHOR_EMAIL: kc-actions-bot[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: kc-actions-bot[bot]
  GIT_COMMITTER_EMAIL: kc-actions-bot[bot]@users.noreply.github.com

jobs:
  tag-agent:
    name: Validate and tag ibm-finops-agent
    runs-on: ubuntu-latest
    outputs:
      is_rc: ${{ steps.validate.outputs.is_rc }}
      sha: ${{ steps.on-develop.outputs.sha }}
    steps:
      # Strict on purpose: the suffix alone decides whether the chart is
      # published, so a near-miss like 1.0.22rc1 must fail, not ship.
      - name: Validate inputs
        id: validate
        run: |
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_rc=false" >> "$GITHUB_OUTPUT"
            echo "✅ Release $VERSION"
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "is_rc=true" >> "$GITHUB_OUTPUT"
            echo "✅ Release candidate $VERSION"
          else
            echo "❌ Invalid version format. Expected: X.Y.Z or X.Y.Z-rc.N (e.g., 1.0.22, 1.0.22-rc.1)"
            exit 1
          fi
          if [ -n "$INPUT_SHA" ] && ! [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "❌ sha must be a full 40 char lowercase commit sha, got '$INPUT_SHA'"
            exit 1
          fi

      - name: Generate app token to tag ibm-finops-agent and watch the build
        id: generate-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.KC_ACTIONS_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.KC_ACTIONS_BOT_APP_PRIVATE_KEY }}
          repositories: |
            ibm-finops-agent
            integration-ci-cd

      # The tag lands on whatever is checked out, so checking out the sha is
      # what pins it. Full history is needed for the develop ancestry check.
      - name: Checkout ibm-finops-agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || 'develop' }}
          fetch-depth: 0
          token: ${{ steps.generate-app-token.outputs.token }}

      - name: Check commit is on develop
        id: on-develop
        run: |
          git fetch origin develop
          if ! git merge-base --is-ancestor HEAD origin/develop; then
            echo "❌ $(git rev-parse HEAD) is not on develop"
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "✅ Tagging $(git rev-parse HEAD)"

      - name: Check tag doesn't exist
        run: |
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "❌ Tag $TAG already exists"
            exit 1
          fi
          echo "✅ Tag $TAG is available"

      - name: Create and push tag
        id: push-tag
        env:
          TAG_MESSAGE: ${{ steps.validate.outputs.is_rc == 'true' && 'Release candidate' || 'Release' }}
        run: |
          # Recorded before the push, so the build poll below can tell our run
          # apart from an earlier release's.
          echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          git tag -a "$TAG" -m "$TAG_MESSAGE $TAG"
          git push $PUSH_ARGS origin "$TAG"

      # The tag push triggers build-release.yaml, which dispatches to
      # $BUILD_REPO. A dispatched run doesn't name our tag, so match on start
      # time and event type (PR builds run the same workflow).
      - name: Wait for image build
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.generate-app-token.outputs.token }}
          SINCE: ${{ steps.push-tag.outputs.since }}
        timeout-minutes: 30
        run: |
          while [ -z "${RUN_ID:-}" ]; do
            sleep 5
            RUN_ID=$(gh run list --repo "$BUILD_REPO" --workflow "$BUILD_WORKFLOW" --created ">=$SINCE" \
              --json databaseId,displayTitle \
              --jq 'map(select(.displayTitle == "finops-agent-release"))[0].databaseId // empty')
          done
          gh run watch "$RUN_ID" --repo "$BUILD_REPO" --exit-status

  update-chart:
    name: Update finops-agent-chart
    needs: tag-agent
    # The one gate between an RC and the chart repo.
    if: needs.tag-agent.outputs.is_rc == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token to update finops-agent-chart
        id: generate-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.KC_ACTIONS_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.KC_ACTIONS_BOT_APP_PRIVATE_KEY }}
          repositories: finops-agent-chart

      # main requires an approved PR, and a PR's author can't approve it.
      - name: Generate approver app token for finops-agent-chart
        id: approver-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.KC_ACTIONS_APPROVER_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.KC_ACTIONS_APPROVER_BOT_APP_PRIVATE_KEY }}
          repositories: finops-agent-chart

      - name: Checkout finops-agent-chart
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CHART_REPO }}
          ref: main
          token: ${{ steps.generate-app-token.outputs.token }}

      - name: Bump image tag and chart version
        run: |
          sed -i -E "/^image:/,/^[^ ]/ s|^  tag: .*|  tag: $TAG|" charts/finops-agent/values.yaml
          sed -i -E "s|^version: .*|version: $VERSION|;
                     s|^appVersion: .*|appVersion: $TAG|" charts/finops-agent/Chart.yaml

          git --no-pager diff

          verify() {
            actual=$(yq "$2" "$1")
            [ "$actual" = "$3" ] || { echo "❌ $1: $2 is '$actual', expected '$3'"; exit 1; }
          }
          verify charts/finops-agent/values.yaml .image.tag "$TAG"
          verify charts/finops-agent/Chart.yaml .version "$VERSION"
          verify charts/finops-agent/Chart.yaml .appVersion "$TAG"

      - name: Push release branch
        run: |
          git checkout -b "$BRANCH"
          git add charts/finops-agent/values.yaml charts/finops-agent/Chart.yaml
          git commit -m "Release $TAG"
          # Force: a rerun after a partial failure finds the earlier attempt's
          # branch. It's only ever written by this workflow.
          git push --force $PUSH_ARGS origin "$BRANCH"

      # The tag triggers the chart publish, so it's pushed only once the
      # approved PR has merged.
      - name: Merge release PR and tag
        if: ${{ !inputs.dry_run }}
        env:
          GH_REPO: ${{ env.CHART_REPO }}
          GH_TOKEN: ${{ steps.generate-app-token.outputs.token }}
          APPROVER_TOKEN: ${{ steps.approver-token.outputs.token }}
        run: |
          # A rerun reuses the open PR from the failed attempt.
          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create --base main --head "$BRANCH" --title "Release $TAG" \
              --body "Automated by https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          fi
          GH_TOKEN=$APPROVER_TOKEN gh pr review "$PR_URL" --approve

          # No --auto, so a successful merge returns only once it has landed.
          # GitHub may still be computing mergeability for the new PR; retry.
          for i in 1 2 3 4 5 6; do
            gh pr merge "$PR_URL" --squash && break
            [ "$i" = 6 ] && { echo "❌ could not merge $PR_URL"; exit 1; }
            echo "⏳ Merge not ready (attempt $i/6), retrying..."
            sleep 10
          done

          SHA=$(gh pr view "$PR_URL" --json mergeCommit --jq .mergeCommit.oid)
          : "${SHA:?could not determine merge commit of $PR_URL}"
          git fetch origin "$SHA"
          git tag -a "$TAG" -m "Release $TAG" "$SHA"
          git push origin "$TAG"

      # --branch matches the tag ref, so this finds the run for the tag just pushed.
      - name: Wait for chart publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.generate-app-token.outputs.token }}
        timeout-minutes: 30
        run: |
          while [ -z "${RUN_ID:-}" ]; do
            sleep 5
            RUN_ID=$(gh run list --repo "$CHART_REPO" --workflow "$CHART_WORKFLOW" --branch "$TAG" \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          done
          gh run watch "$RUN_ID" --repo "$CHART_REPO" --exit-status

  summary:
    name: Release Summary
    needs: [tag-agent, update-chart]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report status
        env:
          TAG_RESULT: ${{ needs.tag-agent.result }}
          CHART_RESULT: ${{ needs.update-chart.result }}
          IS_RC: ${{ needs.tag-agent.outputs.is_rc }}
          SHA: ${{ needs.tag-agent.outputs.sha }}
        run: |
          mark() {
            case "$1" in
              success) echo "✅" ;;
              skipped) echo "⏭️" ;;
              *)       echo "❌" ;;
            esac
          }

          KIND=$([ "$IS_RC" = "true" ] && echo "Release Candidate" || echo "Release")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            TITLE="🔍 Dry Run — FinOps Agent $KIND $TAG (nothing was pushed)"
          else
            TITLE="FinOps Agent $KIND $TAG"
          fi

          if [ "$IS_RC" = "true" ]; then
            CHART_LINE="⏭️ finops-agent-chart untouched (release candidate). Deploy \`$TAG\` to the soak cluster; if it holds, release with \`sha=$SHA\`."
            LINKS="[agent tag](https://github.com/${{ github.repository }}/releases/tag/$TAG)"
          else
            CHART_LINE="$(mark "$CHART_RESULT") finops-agent-chart published (its publish workflow opens the kubecost PR — merge it to finish the release)"
            LINKS="[agent tag](https://github.com/${{ github.repository }}/releases/tag/$TAG) &middot;
          [chart release](https://github.com/$CHART_REPO/releases/tag/$TAG) &middot;
          [kubecost PR](https://github.com/kubecost/kubecost/pulls?q=finops-agent+subchart+$VERSION)"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # $TITLE

          - Commit: \`${SHA:-unknown}\`
          - $(mark "$TAG_RESULT") ibm-finops-agent tagged and image built
          - $CHART_LINE

          $LINKS
          EOF

      # A dry run pushes no tags, so there is never anything to clean up.
      - name: Add cleanup instructions
        if: ${{ !inputs.dry_run && contains(needs.*.result, 'failure') }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF

          ## Manual cleanup

          The release stopped partway through. Delete whichever tags were pushed:

          \`\`\`bash
          gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/$TAG
          $([ "$IS_RC" = "true" ] || echo "gh api -X DELETE repos/$CHART_REPO/git/refs/tags/$TAG")
          \`\`\`
          EOF
