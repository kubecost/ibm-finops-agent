# PR-Agent for this public repository. Self-contained copy of kubecost/kc-pr-agent's
# .github/workflows/pr-agent-kc-org.yml (v0.47): that repository is private, and a public repository cannot
# call its reusable workflow or action. The action itself is fetched at runtime with a GitHub App token
# (see "Fetch PR-Agent action"). When bumping the version, update the ref there and re-sync the jobs below
# with pr-agent-kc-org.yml.
#
# Reads the KC_PR_AGENT_* repository and organization variables documented in kc-pr-agent's
# pr-agent-action-example.yml. The workflow name must stay "PR-Agent" and the file name pr-agent.yml.
name: PR-Agent

on:
  # "*" lets any other workflow's completion wake the readiness check. The two negated patterns are this
  # workflow's name and file name; without them, its own completion would start another run.
  workflow_run:
    workflows: ["*", "!PR-Agent", "!pr-agent.yml"]
    types: [completed]
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  pr_agent_job:
    # Only the repository owner, organization members and collaborators can run commands, so outside
    # commenters cannot spend Bedrock budget. GitHub reports an organization member whose membership is
    # private as CONTRIBUTOR or NONE; make the membership public or add the user as a collaborator.
    if: >-
      ((github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number) ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      github.event.sender.type != 'Bot' && contains(github.event.comment.body, '/') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Run PR Agent commands
    # Serialize automatic candidates without cancelling a review that is already running. The next
    # candidate checks the head and the commit status only after it acquires this group. Manual
    # commands stay in their own group. github.workflow is the calling workflow's name.
    concurrency:
      group: >-
        ${{ github.workflow }}-${{ github.event_name != 'issue_comment' &&
        format('automatic-{0}', github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number) ||
        github.run_id }}
      cancel-in-progress: false
    outputs:
      agent-version: ${{ steps.pragent.outputs.agent-version }}
      reason: ${{ steps.preflight.outputs.reason }}
    # The workflow token reads the PR and posts comments; id-token is for the AWS OIDC step.
    # statuses: write records a successful automatic review on the head commit.
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Check latest head, workflow completion, and previous review
        id: preflight
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUIRED_WORKFLOWS: ${{ vars.KC_PR_AGENT_REQUIRED_WORKFLOWS }}
          OPTIONAL_WORKFLOWS: ${{ vars.KC_PR_AGENT_OPTIONAL_WORKFLOWS }}
          REVIEW_EVERY_PUSH: ${{ vars.KC_PR_AGENT_REVIEW_EVERY_PUSH }}
          # Waiting for every workflow: on a pull_request event, wait this long for the PR's other workflow
          # runs to appear before deciding that there are none.
          SETTLE_SECONDS: "20"
        with:
          script: |
            const decide = async (run, reason) => {
              core.setOutput('run', String(run));
              core.setOutput('reason', reason);
              core.info(reason);
              await core.summary.addHeading('PR-Agent readiness').addRaw(reason, true).write();
            };
            // Workflows to wait for before an automatic review: JSON arrays of workflow names in the step's
            // REQUIRED_WORKFLOWS and OPTIONAL_WORKFLOWS environment. These are the only lists of names to edit.
            // required: run on every pull_request. Each must have a completed run on this head.
            // optional: path-filtered. If a run for this head exists and is still in progress, wait;
            // if none exists, do not wait. With both lists empty, wait for every other pull_request
            // workflow run on this head. A skipped or cancelled completion of some other workflow
            // does not start a review; success, failure, and timed_out do.
            // REVIEW_EVERY_PUSH "true" reviews every new head; otherwise a pull request is reviewed
            // automatically once, and later heads need a comment command.
            const everyHead = process.env.REVIEW_EVERY_PUSH === 'true';
            // Commit status written after a successful automatic review. A failed review does not
            // write it, so rerunning the job retries. Comment commands do not read or write it.
            const reviewStatus = "pr-agent/automatic";
            const own = run => run.name === process.env.GITHUB_WORKFLOW || run.path === '.github/workflows/pr-agent.yml';
            if (context.eventName === 'issue_comment') {
              await decide(true, 'Trusted PR comment command; automatic checks are bypassed.');
              return;
            }
            const names = key => {
              const value = JSON.parse(process.env[key] || '[]');
              if (!Array.isArray(value) || !value.every(name => typeof name === 'string'))
                throw new Error(key + ' must be a JSON array of workflow names.');
              return value;
            };
            const workflows = {required: names('REQUIRED_WORKFLOWS'), optional: names('OPTIONAL_WORKFLOWS')};
            const waitForAll = !workflows.required.length && !workflows.optional.length;
            const event = context.payload;
            if (context.eventName === 'workflow_run') {
              const triggering = event.workflow_run || {};
              if (own(triggering)) {
                await decide(false, 'Ignoring a completion of this workflow.');
                return;
              }
              if (!['success', 'failure', 'timed_out'].includes(triggering.conclusion)) {
                await decide(false, "The triggering workflow conclusion is '" +
                  (triggering.conclusion || 'absent') + "'.");
                return;
              }
            }
            const number = event.pull_request?.number || event.workflow_run?.pull_requests?.[0]?.number;
            const sha = event.workflow_run?.head_sha || event.pull_request?.head?.sha;
            if (!number || !sha) {
              await decide(false, 'No pull request is attached to this run.');
              return;
            }
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
            if (pr.state !== 'open' || pr.draft ||
                pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              await decide(false, 'Automatic reviews require an open, ready PR from this repository.');
              return;
            }
            if (pr.user?.type === 'Bot') {
              await decide(false, 'Automatic reviews skip pull requests opened by bots; a trusted comment command still runs.');
              return;
            }
            if (pr.head.sha !== sha) {
              await decide(false, 'The triggering commit is no longer the PR head.');
              return;
            }
            // The event that opens a PR also starts its other workflows; give their runs time to appear.
            const settle = Number(process.env.SETTLE_SECONDS || 0);
            if (waitForAll && context.eventName === 'pull_request' && settle > 0)
              await new Promise(resolve => setTimeout(resolve, settle * 1000));
            const wanted = new Set([...workflows.required, ...workflows.optional]);
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...context.repo, head_sha: sha, event: 'pull_request', per_page: 100,
            });
            const checks = runs.filter(run => !own(run) && (waitForAll || wanted.has(run.name)) &&
              (run.pull_requests || []).some(item => item.number === number));
            const missing = workflows.required.filter(name => !checks.some(run => run.name === name));
            if (missing.length) {
              await decide(false, 'Waiting for ' + missing.join(', ') + ' to run on this head.');
              return;
            }
            const pending = checks.filter(run => run.status !== 'completed');
            if (pending.length) {
              await decide(false, 'A monitored workflow is still pending on this head: ' +
                pending.map(run => run.name + ' (' + run.status + ')').join(', ') + '.');
              return;
            }
            if (everyHead) {
              const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef,
                {...context.repo, ref: sha, per_page: 100});
              // Newest first: the latest status for the context decides.
              if (statuses.find(item => item.context === reviewStatus)?.state === 'success') {
                await decide(false, 'PR-Agent already completed an automatic review for this head.');
                return;
              }
            } else {
              // One query covers the latest 100 commits of the PR.
              const result = await github.graphql(`query($owner: String!, $repo: String!, $number: Int!, $status: String!) {
                repository(owner: $owner, name: $repo) { pullRequest(number: $number) { commits(last: 100) {
                  nodes { commit { oid status { context(name: $status) { state } } } } } } } }`,
                {...context.repo, number, status: reviewStatus});
              const reviewed = (result.repository?.pullRequest?.commits?.nodes || [])
                .find(node => node.commit?.status?.context?.state === 'SUCCESS');
              if (reviewed) {
                await decide(false, 'PR-Agent already reviewed this pull request automatically at ' +
                  reviewed.commit.oid.slice(0, 7) + '. Comment /review to review the latest head, or set ' +
                  'KC_PR_AGENT_REVIEW_EVERY_PUSH to true to review every new head.');
                return;
              }
            }
            core.setOutput('number', String(number));
            core.setOutput('sha', sha);
            core.setOutput('status', reviewStatus);
            await decide(true, 'The current head has finished its monitored workflows and needs a review.');

      - name: Configure AWS Credentials
        if: steps.preflight.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.KC_PR_AGENT_AWS_REGION || vars.AWS_REGION || 'us-west-2' }}
          role-to-assume: ${{ vars.KC_PR_AGENT_AWS_ROLE_TO_ASSUME || vars.AWS_ROLE_TO_ASSUME }}

      - name: Recheck head immediately before PR-Agent
        id: head
        if: steps.preflight.outputs.run == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.preflight.outputs.number }}
          HEAD_SHA: ${{ steps.preflight.outputs.sha }}
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              core.setOutput('run', 'true');
              return;
            }
            const {data: pr} = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PR_NUMBER),
            });
            const current = pr.state === 'open' && !pr.draft && pr.head.sha === process.env.HEAD_SHA;
            core.setOutput('run', String(current));
            if (!current) core.info('PR state changed while preparing the review; skipping.');

      # The job has no checkout, so the workspace holds only this file. The Action container mounts the
      # workspace at /github/workspace.
      - name: Write organization defaults
        id: defaults
        if: steps.head.outputs.run == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SMALL_PR_MODEL_ARN: ${{ vars.KC_PR_AGENT_AWS_SMALL_PR_MODEL_ARN }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            // Organization defaults. The reviewed repository's .pr_agent.toml overrides any key here.
            const lines = [
              '[config]',
              'enable_claude_adaptive_thinking = true',
              'reasoning_effort = "medium"',
              '# Upper bound on prompt size; a larger diff is clipped to fit.',
              'max_model_tokens = 100000',
              '',
              '[pr_description]',
              '# Post /describe output as a comment instead of overwriting the PR description.',
              'publish_description_as_comment = true',
              '',
              '[github_action_config]',
              '# Tools that run automatically. /improve, the most expensive, runs when someone comments it.',
              'auto_describe = true',
              'auto_review = true',
              'auto_improve = false',
            ];
            // Optional cheaper primary model for small pull requests.
            const small = process.env.SMALL_PR_MODEL_ARN;
            if (small) {
              if (!/^arn:aws:bedrock:[a-z0-9-]+:[0-9]{12}:(?:application-)?inference-profile\/[A-Za-z0-9._:-]+$/.test(small)) {
                core.setFailed('KC_PR_AGENT_AWS_SMALL_PR_MODEL_ARN is not a Bedrock inference profile ARN.');
                return;
              }
              lines.push('', '[model_routing]', 'enable = true',
                'rules = [{ max_hunks = 6, max_files = 4, model = ' + JSON.stringify(small) + ' }]');
            }
            const file = path.join(process.env.GITHUB_WORKSPACE, '.kc-pr-agent', 'org-defaults.toml');
            fs.mkdirSync(path.dirname(file), {recursive: true});
            fs.writeFileSync(file, lines.join('\n') + '\n');
            core.setOutput('path', file);

      # kubecost/kc-pr-agent is private and this repository is public, so GitHub rejects both a reusable
      # workflow call and a `uses: kubecost/kc-pr-agent@...` step. Instead, fetch the composite action with a
      # GitHub App token and run it from a local path. The KC_ACTIONS_BOT app must be installed on
      # kc-pr-agent with contents: read. Only action.yaml is needed; the runtime image is public on ECR.
      - name: Generate token to read kc-pr-agent
        id: agent-token
        if: steps.head.outputs.run == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.KC_ACTIONS_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.KC_ACTIONS_BOT_APP_PRIVATE_KEY }}
          repositories: kc-pr-agent
          permission-contents: read
      - name: Fetch PR-Agent action
        if: steps.head.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kubecost/kc-pr-agent
          ref: d9926c3da5b6087095fe4c839dab50a764260704 # v0.47
          token: ${{ steps.agent-token.outputs.token }}
          path: .kc-pr-agent-action
          sparse-checkout: action.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: PR Agent action step
        id: pragent
        if: steps.head.outputs.run == 'true'
        uses: ./.kc-pr-agent-action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG__EXTRA_CONFIG_URL: ${{ steps.defaults.outputs.path }}
          AWS_USE_IMDS: "true"
          AWS_REGION: ${{ vars.KC_PR_AGENT_AWS_REGION || vars.AWS_REGION || 'us-west-2' }}
          AWS_REGION_NAME: ${{ vars.KC_PR_AGENT_AWS_REGION || vars.AWS_REGION || 'us-west-2' }}
          # Bedrock inference profile ARNs: the KC_PR_AGENT_ variable, else the legacy unprefixed one.
          # Before each command PR-Agent asks Bedrock which model each profile serves, so the assumed role needs
          # bedrock:GetInferenceProfile and bedrock:ListInferenceProfiles. An empty reasoning or weak model uses
          # CONFIG__MODEL, and the fallback defaults to the primary.
          CONFIG__MODEL: ${{ vars.KC_PR_AGENT_AWS_MODEL_ARN || vars.AWS_MODEL_ARN }}
          CONFIG__MODEL_REASONING: ${{ vars.KC_PR_AGENT_AWS_REASONING_MODEL_ARN || vars.AWS_REASONING_MODEL_ARN }}
          CONFIG__MODEL_WEAK: ${{ vars.KC_PR_AGENT_AWS_WEAK_MODEL_ARN || vars.AWS_WEAK_MODEL_ARN }}
          CONFIG__FALLBACK_MODELS: >-
            ${{ vars.KC_PR_AGENT_AWS_FALLBACK_MODEL_ARN || vars.AWS_FALLBACK_MODEL_ARN
            || vars.KC_PR_AGENT_AWS_MODEL_ARN || vars.AWS_MODEL_ARN }}
          # Context window of the ARN-based models; config.max_model_tokens above bounds what is sent.
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "1000000"
          # Traces to Tempo over OTLP with the ai-attribution fields (tenant, service, repo, PR number, user).
          # Off until KC_PR_AGENT_OTEL_ENDPOINT is set; KC_PR_AGENT_OTEL_HEADERS is a secret, for example
          # "Authorization=Bearer <otel-ingest-token>". Both the endpoint and the headers stay out of logs.
          OTEL__IS_ENABLED: ${{ vars.KC_PR_AGENT_OTEL_ENDPOINT != '' }}
          OTEL__EXPORTER_TYPE: otlp
          OTEL__ENVIRONMENT: production
          OTEL__OTLP_ENDPOINT: ${{ vars.KC_PR_AGENT_OTEL_ENDPOINT }}
          OTEL__OTLP_HEADERS: ${{ secrets.KC_PR_AGENT_OTEL_HEADERS }}
          OTEL__ATTRIBUTION_TENANT_ID: ${{ vars.KC_PR_AGENT_ATTRIBUTION_TENANT_ID }}
          OTEL__ATTRIBUTION_SERVICE_ID: ${{ vars.KC_PR_AGENT_ATTRIBUTION_SERVICE_ID }}

      # Write only after success, so a failed review can be retried by rerunning this job.
      - name: Record completed automatic review
        if: github.event_name != 'issue_comment' && steps.pragent.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ steps.preflight.outputs.sha }}
          REVIEW_STATUS: ${{ steps.preflight.outputs.status }}
        with:
          script: |
            const server = process.env.GITHUB_SERVER_URL;
            const repo = context.repo.owner + '/' + context.repo.repo;
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.HEAD_SHA,
              state: 'success',
              context: process.env.REVIEW_STATUS,
              description: 'Automatic PR-Agent tools finished',
              target_url: server + '/' + repo + '/actions/runs/' + context.runId,
            });

  report:
    name: Explain PR-Agent outcome
    needs: pr_agent_job
    if: >-
      always() && (needs.pr_agent_job.result == 'failure' || needs.pr_agent_job.result == 'cancelled' ||
      (needs.pr_agent_job.result == 'skipped' && github.event_name == 'issue_comment'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Report failures and skipped jobs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AGENT_REASON: ${{ needs.pr_agent_job.outputs.reason }}
          AGENT_RESULT: ${{ needs.pr_agent_job.result }}
          AGENT_VERSION: ${{ needs.pr_agent_job.outputs.agent-version }}
          ACTION_REF: kubecost/kc-pr-agent@v0.47 (local checkout)
        with:
          script: |
            const escape = value => String(value).replace(/[&<>"]/g, c =>
              ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
            const event = context.payload;
            const agent = process.env.AGENT_RESULT;
            let reason = process.env.AGENT_REASON;
            if (!reason && agent === 'skipped') {
              if (context.eventName === 'issue_comment') {
                if (!event.issue?.pull_request) reason = 'The comment is on an issue, not a pull request.';
                else if (event.sender?.type === 'Bot') reason = 'Bot comments are ignored to prevent feedback loops.';
                else if (!(event.comment?.body || '').includes('/')) reason = 'The comment contains no slash command.';
                else if (!['OWNER', 'MEMBER', 'COLLABORATOR'].includes(event.comment?.author_association))
                  reason = 'The comment author is not an owner, member, or collaborator.';
                else reason = 'Automatic checks are bypassed for trusted PR comment commands.';
              } else reason = 'This event is not eligible for an automatic review.';
            }
            if (!reason) reason = 'Agent ' + agent + '; inspect the job logs for details.';
            const runUrl = process.env.GITHUB_SERVER_URL + '/' + context.repo.owner + '/' + context.repo.repo +
              '/actions/runs/' + context.runId;
            const lines = ['## PR-Agent workflow outcome', '', 'Agent: ' + escape(agent), '',
              '<pre>' + escape(reason) + '</pre>', '', 'Event: ' + escape(context.eventName) + ' / ' + escape(event.action || ''),
              'Configured Action: ' + escape(process.env.ACTION_REF),
              'Runtime version: ' + escape(process.env.AGENT_VERSION || 'unavailable (the agent did not report a version)'),
              '', '[Action run and logs](' + runUrl + ')'];
            const prNumber = event.pull_request?.number || event.workflow_run?.pull_requests?.[0]?.number ||
              (event.issue?.pull_request ? event.issue.number : null);
            const head = event.workflow_run?.head_sha || event.pull_request?.head?.sha;
            if (prNumber) lines.push('', 'Pull request: #' + escape(prNumber));
            if (head) lines.push('Head commit: ' + escape(head));
            if (event.workflow_run?.conclusion)
              lines.push('Triggering workflow conclusion: ' + escape(event.workflow_run.conclusion));
            if (['failure', 'cancelled'].includes(agent)) {
              try {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  ...context.repo, run_id: context.runId, filter: 'latest', per_page: 100,
                });
                for (const job of jobs) {
                  if (job.name === 'Explain PR-Agent outcome') continue;
                  for (const step of job.steps || []) {
                    if (['failure', 'cancelled'].includes(step.conclusion))
                      lines.push('', '<pre>Failed or cancelled step: ' + escape(job.name) + ' / ' + escape(step.name) +
                        ' (' + escape(step.conclusion) + ')</pre>');
                  }
                }
              } catch {
                lines.push('', 'Step details could not be retrieved; consult the Action logs.');
                core.warning('Unable to retrieve workflow step outcomes.');
              }
            }
            await core.summary.addRaw(lines.join('\n') + '\n').write();
