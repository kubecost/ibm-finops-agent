clusterId: "e2e"
global:
  federatedStorage:
    config: |-
      type: S3
      config:
        bucket: kubecost-store
        endpoint: "localstack:4566"
        access_key: ""
        insecure: true
        signature_version2: false
        secret_key: ""
        put_user_metadata:
          "X-Amz-Acl": "bucket-owner-full-control"
        http_config:
          idle_conn_timeout: 90s
          response_header_timeout: 2m
          insecure_skip_verify: false
        trace:
          enable: true
        part_size: 134217728
    existingSecret: ""
agent:
  kubecost:
    enabled: true
  # Short intervals so the self-hosted specs see usage in the bucket within
  # about 30s instead of 3+ minutes.
  collectorDataSource:
    scrapeInterval: 5s
  exporter:
    emissionInterval: 10s
  exportIntervals:
    allocation: 10s
    asset: 10s
    heartbeat: 10s
    diagnostics: 10s
  cloudability:
    enabled: true
    uploadRegion: staging
    emissionInterval: 10s
    secret:
      create: true
      cloudabilityAccessKey: "XXX"
      cloudabilitySecretKey: "XXX"
      cloudabilityEnvId: "XXX"
# The chart has no value for the kubemodel export interval.
extraEnvVars:
  - name: KUBEMODEL_EXPORT_INTERVAL
    value: 10s
sidecars:
  - name: e2e-reader
    image: busybox:1.37
    command: ["sleep", "infinity"]
    volumeMounts:
      - name: data
        mountPath: /opt/finops-agent
        readOnly: true
