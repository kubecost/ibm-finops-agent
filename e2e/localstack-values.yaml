# LocalStack configuration for e2e testing
# Using a dummy auth token for local testing
extraEnvVars:
  - name: LOCALSTACK_AUTH_TOKEN
    value: "test-token"

# Service configuration
service:
  type: NodePort
  
# Startup probe configuration to give more time for initialization
startupProbe:
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 30

# Resource limits for e2e testing
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi
