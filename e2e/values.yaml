clusterId: "e2e"
exportBucket:
  secret:
    create: true
    config: |-
      type: S3
      config:
        bucket: kubecost-store
        endpoint: "localstack:4566"
        access_key: ""
        insecure: true
        signature_version2: false
        secret_key: ""
        put_user_metadata:
          "X-Amz-Acl": "bucket-owner-full-control"
        http_config:
          idle_conn_timeout: 90s
          response_header_timeout: 2m
          insecure_skip_verify: false
        trace:
          enable: true
        part_size: 134217728
    existingSecret: ""
agent:
  kubecost:
    enabled: false # TODO: Delete or make true once kubecost export bucket config is fixed in helm chart
  cloudability:
    uploadRegion: staging
    emissionInterval: 10s
    secret:
      create: true
      cloudabilityAccessKey: "XXX"
      cloudabilitySecretKey: "XXX"
      cloudabilityEnvId: "XXX"
